<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国奶龙大学 · 正在前往湖州师范大学官网</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="description" content="奶龙正在护送你前往中国奶龙大学，随后自动前往湖州师范大学官网。">
<link rel="canonical" href="https://xn--fiqs8srwb9iv6f6w9n.org/">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  background:radial-gradient(120% 100% at 50% 0%,#fff6d8 0%,#ffeec2 45%,#ffe3a3 100%);
  color:#4a3600;display:flex;align-items:center;justify-content:center;overflow:hidden}
.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.snow span{position:absolute;top:-10%;color:#f7c000;opacity:.5;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(110vh) rotate(360deg)}}
.card{position:relative;z-index:2;text-align:center;padding:30px 40px 28px;border-radius:26px;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);
  box-shadow:0 20px 60px rgba(180,130,0,.22);backdrop-filter:blur(8px);max-width:560px;width:92vw}
.mascot{display:block;width:74%;max-width:380px;height:auto;margin:0 auto 4px;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
h1{font-size:30px;letter-spacing:2px;font-weight:800;
  background:linear-gradient(92deg,#e8a200,#ffd23f,#e8a200);-webkit-background-clip:text;background-clip:text;color:transparent}
.en{font-size:11px;letter-spacing:3px;color:#b08a2a;margin-top:6px;text-transform:uppercase}
.motto{margin-top:12px;font-size:13px;color:#8a6f2e}
.bar{margin:22px auto 10px;width:86%;height:10px;border-radius:99px;background:rgba(180,140,0,.16);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffd23f,#ff9f1c,#ffe066);transition:width .25s linear}
.status{font-size:14px;color:#5c4700;min-height:20px}
.hint{margin-top:14px;font-size:12px;color:#9a8244}
.btn{display:inline-block;margin-top:16px;padding:11px 22px;border-radius:99px;
  background:linear-gradient(92deg,#ffd23f,#ff9f1c);color:#3a2600;font-weight:800;font-size:14px;
  text-decoration:none;box-shadow:0 8px 22px rgba(255,160,30,.35)}
.btn:hover{filter:brightness(1.06)}
.credit{position:fixed;right:14px;bottom:10px;font-size:12px;letter-spacing:.4px;color:rgba(120,95,20,.55);
  user-select:none;z-index:5;font-family:inherit}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<noscript><meta http-equiv="refresh" content="2;url=https://www.huznu.edu.cn/"></noscript>
<main class="card">
  <img class="mascot" src="/mascot.png" alt="湖州师范大学校徽与奶龙">
  <h1>中国奶龙大学</h1>
  <p class="en">China Nailong University</p>
  <p class="motto">校训：明体达用</p>
  <div class="bar"><i id="fill"></i></div>
  <p class="status" id="status">正在校验录取通知书…</p>
  <div class="hint" id="hint">本页将在动画结束后自动跳转</div>
  <a class="btn" id="go" href="https://www.huznu.edu.cn/">跳过动画，直接前往 →</a>
</main>
<!-- 想署名就改成 creater:你的id；这行由 config.json 的 credit 生成 -->
<div class="credit">非官方粉丝站点 · 与湖州师范大学无官方关联</div>
<script>
var TARGET = "https://www.huznu.edu.cn/";
var AUTO_REDIRECT = true;   // 预览时改成 false，就不会真的跳走
var steps = ["正在校验录取通知书…", "正在给奶龙带上行李…", "奶龙学长已就位，准备出发…", "即将前往 湖州师范大学 官网"];
var STEP_MS = 800, TICK = 50, TOTAL = STEP_MS * steps.length;
var fill = document.getElementById("fill"), statusEl = document.getElementById("status"),
    hint = document.getElementById("hint"), go = document.getElementById("go");
var snow = document.getElementById("snow"), flakes = "✦✧·";
for (var i = 0; i < 34; i++) {
  var s = document.createElement("span");
  s.textContent = flakes[i % 3];
  s.style.left = (Math.random() * 100) + "%";
  s.style.fontSize = (8 + Math.random() * 14) + "px";
  s.style.animationDuration = (6 + Math.random() * 7) + "s";
  s.style.animationDelay = (-Math.random() * 10) + "s";
  snow.appendChild(s);
}
statusEl.textContent = steps[0];
var si = 0, ticks = 0, t0 = Date.now();
var timer = setInterval(function () {
  ticks++;
  var el = Math.max(Date.now() - t0, ticks * TICK);
  fill.style.width = Math.min(100, el / TOTAL * 100) + "%";
  var idx = Math.min(steps.length - 1, Math.floor(el / STEP_MS));
  if (idx !== si) { si = idx; statusEl.textContent = steps[idx]; }
  if (el >= TOTAL) {
    clearInterval(timer);
    fill.style.width = "100%";
    statusEl.textContent = "已到达，正在跳转…";
    hint.textContent = "没跳的话点下面按钮";
    done();
  }
}, TICK);
function done() {
  if (AUTO_REDIRECT) { setTimeout(function () { window.location.replace(TARGET); }, 500); }
  else { hint.textContent = "预览模式：不会真的跳走，点按钮试试"; }
}
</script>
</body>
</html>
